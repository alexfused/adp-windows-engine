# Which of Hadron's Wine patches (patches/wine at HADRON_REF in env.sh) the Intel engine applies, and why.
# Format: <patch number> <apply|skip> <reason>
# Rule: the arm64 engine's set, minus every patch that is specific to arm64, to FEX (the x86 emulator)
# or to 16 KB host pages. Intel Macs run x86_64 and i386 Windows code natively, with 4 KB pages.
# patches.sha256 pins every applied file; fetch.sh applies them in this order with patch -F0.

0001 skip   arm64 only: 4 GB __PAGEZERO for the arm64 loader (configure's aarch64 branch)
0002 skip   arm64 only: W^X page flipping (Intel macOS allows exec+write pages with allow-unsigned-executable-memory)
0003 skip   arm64 only: KUSER_SHARED_DATA above 4 GB, for arm64 hosts that cannot map below 4 GB
0004 skip   arm64 only: custom x18 ABI (x18 is an arm64 register)
0005 skip   arm64 only in effect: on arm64 the top-down area ended at the top of user space (EFAULT in execve); on x86_64 it already ends 30 MB below it (MACH_VM_MAX_ADDRESS 0x7fffffe00000)
0006 skip   arm64 only: concurrent W^X page flips
0007 skip   DXMT (Metal) function table; not in the arm64 engine either
0008 skip   arm64 only: claims the cross-architecture entitlement's soft __PAGEZERO; the Intel loader is a plain executable, not inside an .app
0009 skip   Steam client redirection; not in the arm64 engine either
0010 skip   arm64 only: hardware TSO (Intel is TSO already)
0011 skip   FEX only: MAP_JIT code buffers for the emulator's JIT
0012 skip   external Metal views (DXMT/mtld3d); not in the arm64 engine either
0013 apply  winemac.drv: a display mode set while inactive is reported at once (and context for 0016, 0030-0033)
0014 skip   external Metal views (DXMT/mtld3d); not in the arm64 engine either
0015 apply  WINE_LARGE_ADDRESS_AWARE opt-in for 32-bit programs under WoW64 (off unless set)
0016 apply  winemac.drv: capture only the display whose mode changes
0017 skip   winevulkan (built without Vulkan); not in the arm64 engine either
0018 apply  winemac.drv: Mac-like scrolling
0019 skip   ARM64EC only: makedep resources of ARM64EC-only modules (no ARM64EC on Intel)
0020 skip   arm64 only: ARM64 ID registers for FEX
0021 apply  winemac.drv: application icon entries copied off the callback stack (Dock icon sizes)
0022 apply  WINELOADER names the loader child processes start with (Dock name per program)
0023 skip   OpenGL on EGL (Zink); not in the arm64 engine either
0024 apply  wine.inf: VC runtime version 14.51.36247 (installers stop re-running the redistributable)
0025 apply  skip occupied host mappings in macOS address searches (stalls; generic macOS code)
0026 skip   Steam overlay input; not in the arm64 engine either
0027 apply  winemac.drv: keep minimisation during inactive window-level changes
0028 skip   EGL surfaces opaque (Zink); not in the arm64 engine either
0029 apply  winemac.drv: inactive floating policy before the Dock floor
0030 apply  winemac.drv: display mode change on any display
0031 apply  winemac.drv: move windows with a display a mode change moves
0032 apply  winemac.drv: name the built-in display "Built-in"
0033 apply  win32u: emulate display mode changes by default (a Windows program never changes the Mac's display mode)
0034 skip   16 KB pages only: clear decommitted 4 KB guest pages
0035 skip   16 KB pages only: clear writable partial host pages in place
0036 skip   16 KB pages only: unaligned shared image sections as private copies
0037 skip   Retina mode by default; the arm64 engine keeps Wine's points mode too (old utilities are not DPI-aware)
0038 apply  winemac.drv: HORZRES/VERTRES in Retina mode (only matters if RetinaMode is turned on)
0039 apply  winemac.drv: cursor size in Retina mode (same)
