# What this release is. The tools in tools/ and publish-release.sh source this file.
# Change a value here, then rerun tools/build-assets.sh; nothing else holds these names.
# No personal paths here: this file is published. The two build folders below default to their places in the
# ADP Monitor checkout; point ARM64_SPIKE / X86_64_SPIKE at another copy with the environment.
KIT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

REPO=alexfused/adp-windows-engine
TAG=engines-2026-10-21b
RELEASE_TITLE="Windows engines 2026-10-21b"
BASE_URL="https://github.com/$REPO/releases/download/$TAG"
SOURCE_DATE_EPOCH=1792540800   # 2026-10-21T00:00:00Z: the time stored in the tarballs we make

# Commits to the public repository: the GitHub account's no-reply address, never a personal one.
# publish-release.sh checks the id against `gh api user` before it commits.
PUBLISH_GIT_NAME=alexfused
PUBLISH_GIT_ID=276656355
PUBLISH_GIT_EMAIL="$PUBLISH_GIT_ID+$PUBLISH_GIT_NAME@users.noreply.github.com"

# ---- Apple silicon engine (spikes/windows-engine-arm64 in ADP Monitor) ----
ARM64_SPIKE="${ARM64_SPIKE:-$KIT/../windows-engine-arm64}"
ARM64_ENGINE=engine-arm64-11.18-2
ARM64_ARCHIVE="$ARM64_SPIKE/dist/archive/$ARM64_ENGINE.tar.xz"
ARM64_ARCHIVE_SHA256=67cb8cde7299c701a3aae047ba13ae7fff69237904e383eae8536d1f8e8e1c94   # second packing: VIXL and musl notices added
ARM64_MANIFEST_IN="$ARM64_SPIKE/dist/archive/$ARM64_ENGINE.manifest.json"
ARM64_SCRIPTS_COMMIT=0da76e722f0b9775ddd4ffe37f7e5605eca5b977   # the ADP Monitor commit whose scripts built it
ARM64_SCRIPTS_PATH=spikes/windows-engine-arm64                  # ... and the folder in that commit (tools/import-build-scripts.py)
WINE_COMMIT=6880117619afdf62b4ccc40a8c6268c86613131f      # Hadron's pin; the release tarball is this tree
WINE_ARM64_PATCHED=8f4bf95c31efaa345dfb56e905c78ac2609ff0e2    # after the 30 Hadron patches (wine-11.18-276-g8f4bf95c31)
FEX_COMMIT=0df84d3844bcdb87bb7d3f5b8fb0959cd009c038
FEX_PATCHED=a5eec1a8ce4137cc2b7d499bc2decbaace3dd494      # after the 5 Hadron FEX patches
HADRON_COMMIT=d523fe6b8fa0d8632911d49d02980769f2d4261c
# FEX submodules the build compiles (work/build/fex-*/build.ninja). The others are left out: see
# SUBMODULES-ADP.txt in the FEX source tarball.
FEX_SUBMODULES="External/fmt External/xxhash External/range-v3 External/unordered_dense External/rpmalloc Source/Common/cpp-optparse"
# Our tarball of FEX at FEX_COMMIT with those submodules (tools/make-fex-src.sh makes it from a FEX git
# checkout; tools/dettar.py makes the same bytes every time).
FEX_SRC_SHA256=45d014d767c784ec679d1200bacc6838361fad800a8e6545920fdbcd35f83ccc

# ---- Intel engine (spikes/windows-engine-intel in ADP Monitor): built from source by us ----
X86_64_SPIKE="${X86_64_SPIKE:-$KIT/../windows-engine-intel}"
X86_64_ENGINE=engine-x86_64-11.18-1
X86_64_ARCHIVE="$X86_64_SPIKE/dist/archive/$X86_64_ENGINE.tar.xz"
X86_64_ARCHIVE_SHA256=bb512d1e1433926305707bed0ff24a10c481fc3d1a217abdee7a296f09788e87
X86_64_MANIFEST_IN="$X86_64_SPIKE/dist/archive/$X86_64_ENGINE.manifest.json"
X86_64_SCRIPTS_COMMIT=3d5eeb55a2b9f6ef0fc0a577b9cf47b0f5cbe277   # the ADP Monitor commit whose scripts built it
# (75c84154fb20 built it; 3d5eeb55a2b9 changes only test-on-intel.sh and README.md: the first Intel run)
X86_64_SCRIPTS_PATH=spikes/windows-engine-intel
# Apple notarised the published archive's files on 22 Oct 2026, after the release: Accepted, 0 issues, all 36 Mach-O
# cdhashes in the ticket. The archive did not change. No app to staple, so Gatekeeper fetches the ticket online.
# The release manifest (written before) still says "notarized": false. tools/notices.py writes this into the notes.
X86_64_NOTARY_SUBMISSION=9d595ff6-8168-4498-a284-1663f99781f8
X86_64_NOTARISED_ON=2026-10-22
LLVM_MINGW_TARBALL_SHA256=52e5f5a7b131021d0c39a37a38fa380a1da7885cd04bd61afd0cd4ecfb8bc1f3   # build tool for both engines, not a release file

# ---- Identity guard (publish-release.sh, tools/engine-guard.py) ----
# ADP Monitor's own signing identifier. No Mach-O file of an engine may carry it.
ADP_MONITOR_BUNDLE_ID=com.alexparkin.adpmonitor
# The root helper's caller requirement, as Sources/ADPHelper/main.swift (callerRequirement) and
# Sources/SMCKit/HelperProtocol.swift (trustedSignerClause) build it. engine-guard.py reads it again from that
# source when ADP_MONITOR_SOURCE holds it and refuses to go on if the two differ. No engine file may satisfy it.
HELPER_REQUIREMENT='identifier "com.alexparkin.adpmonitor" and (certificate root = H"7d6ad979b37022c4120f1e676a2d4b6359208919" or (anchor apple generic and certificate leaf[subject.OU] = "2F2FVY326V"))'
ADP_MONITOR_SOURCE="${ADP_MONITOR_SOURCE:-$KIT/../..}"
# A file the requirement must ACCEPT, so a requirement that refuses everything cannot fake the proof.
HELPER_CONTROL="${HELPER_CONTROL:-/Applications/ADP Monitor.app}"

# ---- Decisions (Alex, 21 Oct 2026) ----
# "yes": this repository's own files (scripts, tools, documents, manifests) are published under the MIT licence
# in LICENSE. publish-release.sh refuses while it is anything else.
CONFIRM_SCRIPTS_LICENCE=yes
