# Which of Hadron's patches (at HADRON_REF) this engine applies, and why. fetch.sh reads it.
# Format: <component> <patch number> <apply|skip> <reason>
# We want Wine (arm64 + ARM64EC + i386 WoW64) and FEX, not Hadron's Steam, Metal/D3D or game parts.

# Engine core: arm64 macOS host, the cross-architecture entitlement, FEX's needs.
wine 0001 apply  4 GB __PAGEZERO for the arm64 loader (smaller is SIGKILLed)
wine 0002 apply  W^X: flip exec+write pages between RW and RX
wine 0003 apply  KUSER_SHARED_DATA above 4 GB when built with -DWINE_HIGH_USER_SHARED_DATA (unused here; later patches touch the same lines)
wine 0004 apply  custom x18 ABI so x18 keeps the TEB
wine 0005 apply  keep allocations out of the top 16 MB (execve EFAULT)
wine 0006 apply  concurrent W^X page flips
wine 0007 skip   DXMT function table (Metal)
wine 0008 apply  loader: claim the soft __PAGEZERO (memory below 4 GB) and run from <name>.app/Contents/MacOS
wine 0009 skip   steamclient.dll redirection (Steam)
wine 0010 apply  hardware TSO on every thread
wine 0011 apply  MAP_JIT code buffers for FEX
wine 0012 skip   external Metal views (DXMT/mtld3d)
wine 0013 apply  display mode set while inactive is reported at once (needed context for 0016, 0030-0033)
wine 0014 skip   client surface of external Metal views (DXMT/mtld3d)
wine 0015 apply  WINE_LARGE_ADDRESS_AWARE opt-in for 32-bit programs (off unless set)
wine 0016 apply  capture only the display whose mode changes
wine 0017 skip   winevulkan struct conversion (Vulkan/vkd3d-proton)
wine 0018 apply  Mac-like scrolling
wine 0019 apply  makedep: ARM64EC-only modules keep their resources (version info of vcruntime140_1 etc.)
wine 0020 apply  report ARM64 ID registers so FEX sees the CPU's features
wine 0021 apply  application icon entries copied off the callback stack (Dock icon sizes)
wine 0022 apply  WINELOADER names the loader child processes start with (Dock name per program)
wine 0023 skip   OpenGL on EGL (Zink)
wine 0024 apply  VC runtime version in wine.inf (installers stop re-running the redistributable)
wine 0025 apply  skip occupied host mappings in address searches (stalls)
wine 0026 skip   mouse and keyboard to Steam's overlay (Steam)
wine 0027 apply  keep minimisation during inactive window-level changes
wine 0028 skip   EGL surfaces opaque (Zink)
wine 0029 apply  inactive floating policy before the Dock floor
wine 0030 apply  display mode change on any display (context for 0033)
wine 0031 apply  move windows with a display a mode change moves
wine 0032 apply  name the built-in display "Built-in"
wine 0033 apply  emulate display mode changes by default: a Windows program never changes the Mac's display mode
wine 0034 apply  16 KB hosts: clear decommitted 4 KB guest pages
wine 0035 apply  16 KB hosts: clear writable partial host pages in place
wine 0036 apply  16 KB hosts: unaligned shared image sections as private copies
wine 0037 skip   Retina mode by default (old utilities are not DPI-aware; keep Wine's points mode)
wine 0038 apply  HORZRES/VERTRES fix in Retina mode (only matters if RetinaMode is turned on)
wine 0039 apply  cursor size in Retina mode (same)

# FEX: all five are needed on macOS.
fex 0001 apply   build the UnixLib on macOS
fex 0002 apply   64 KB guard regions for the call/ret stack
fex 0003 apply   64 KB guard regions for JIT buffers
fex 0004 apply   thread_set_x86_64_compat for hardware TSO
fex 0005 apply   per-thread W^X JIT code buffers on macOS
